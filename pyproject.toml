[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "frc-rl-driver"
version = "0.1.0"
description = "PPO-based autonomous driving model for FIRST Robotics Competition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "stable-baselines3>=2.3.0",
    "gymnasium>=0.29.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
wpilib = [
    # WPILib NetworkTables 4 bridge (optional – only needed when connecting
    # to a live maple-sim / WPILib robot simulation process).
    "robotpy-ntcore>=2024.3.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
